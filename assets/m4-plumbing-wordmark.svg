<svg xmlns="http://www.w3.org/2000/svg" width="660" height="160" viewBox="0 0 660 160" role="img" aria-labelledby="title desc">
  <title id="title">M4 Plumbing concept wordmark</title>
  <desc id="desc">A bold blue M4 Plumbing concept wordmark with phone number 701-500-9051.</desc>
  <defs>
    <linearGradient id="blueFill" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2383e8"/>
      <stop offset="1" stop-color="#0b54b7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#0b2545" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect x="4" y="5" width="652" height="150" rx="12" fill="#ffffff"/>
  <g filter="url(#shadow)" font-family="Arial Black, Impact, Arial, Helvetica, sans-serif" font-weight="900">
    <text x="20" y="122" font-size="116" letter-spacing="-7" fill="url(#blueFill)" stroke="#07336f" stroke-width="5" paint-order="stroke">M4</text>
    <text x="192" y="67" font-size="60" letter-spacing="-1" fill="url(#blueFill)" stroke="#07336f" stroke-width="3.5" paint-order="stroke">PLUMBING</text>
    <text x="194" y="122" font-size="43" letter-spacing="1" fill="#1267b1" stroke="#07336f" stroke-width="2" paint-order="stroke">701-500-9051</text>
  </g>
  <path d="M194 82h392" stroke="#2ab7c9" stroke-width="5" stroke-linecap="round"/>
</svg>
